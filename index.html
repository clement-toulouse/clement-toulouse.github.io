    <!--
      Pose le thème avant le premier paint : sans ça, la page s'affiche en
      sombre puis bascule en clair une fois React monté.
    -->
    <script>
      // Le site est pensé en clair : c'est le défaut, quelle que soit la
      // préférence système. Seul un choix explicite via le bouton est retenu.
      // Pour suivre l'OS à la place : remplacer 'light' par
      // matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {}
    </script>

    <!--
      Analytics respectueux de la vie privée (GoatCounter) : aucun cookie,
      aucune donnée personnelle, aucun bandeau de consentement requis (conforme
      RGPD sans opt-in). Le code est substitué au build depuis
      `profile.goatCounterCode` (content.fr.ts). Tant qu'il est vide, rien n'est
      chargé : pas de script tiers, pas de requête. Pour activer : créer un
      compte gratuit sur goatcounter.com et renseigner le code choisi.
    -->
    <script>
      ;(function () {
        var code = '__GC_CODE__'
        if (!code || code.charAt(0) === '_') return // vide ou placeholder : on ne charge rien
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://gc.zgo.at/count.js'
        s.setAttribute('data-goatcounter', 'https://' + code + '.goatcounter.com/count')
        document.head.appendChild(s)
      })()
    </script>
