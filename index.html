    <!--
      Pose le thème avant le premier paint : sans ça, la page s'affiche en
      sombre puis bascule en clair une fois React monté.
    -->
    <script>
      // Le site est pensé en clair : c'est le défaut, quelle que soit la
      // préférence système. Seul un choix explicite via le bouton est retenu.
      // Pour suivre l'OS à la place : remplacer 'light' par
      // matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {}
